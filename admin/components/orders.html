<!-- Orders Section -->
<div class="section-header">
    <h1><i class="fa-solid fa-cart-shopping"></i> Quản lý đơn hàng</h1>
    <p>Quản lý và theo dõi đơn hàng của cửa hàng.</p>
</div>

<div class="order-body">
    <div class="order-control">
        <div class="order-control-left">
            <select name="order-status" id="filter-order-status">
                <option value="">Tất cả trạng thái</option>
                <option value="new">Đơn mới</option>
                <option value="processing">Đang xử lý</option>
                <option value="delivered">Đã giao</option>
                <option value="cancelled">Đã hủy</option>
            </select>
        </div>
        <div class="order-control-center">
            <form action="" class="form-search" onsubmit="return false;">
                <input type="text" id="form-search-order" placeholder="Tìm kiếm theo mã đơn, khách hàng...">
                <div class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
            </form>
        </div>
        <div class="order-control-right">
            <div class="filter-date">
                <label for="time-start-order">Từ ngày:</label>
                <input type="date" id="time-start-order">
            </div>
            <div class="filter-date">
                <label for="time-end-order">Đến ngày:</label>
                <input type="date" id="time-end-order">
            </div>
            <button class="btn-control" id="btn-refresh-order"><i class="fa-solid fa-arrows-rotate"></i> Làm mới</button>
        </div>
    </div>
    
    <!-- Container sẽ được JavaScript tự động fill vào -->
    <div class="show-order-container" id="show-order-container">
    </div>
</div>
