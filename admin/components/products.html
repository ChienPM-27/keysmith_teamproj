<div class="section-header">
    <h1><i class="fa-solid fa-keyboard"></i>Quản lý sản phẩm</h1>
    <p>Quản lý và theo dõi các sản phẩm trong cửa hàng của bạn.</p>
</div>

<div class="product-body">
    <div class="product-control">
        <div class="product-control-left">
            <select name="the-loai" id="the-loai" onchange="showProduct()">
                <option value="">Tất cả</option>
                <option value="">Attack On Titan</option>
                <option value="">One Piece</option>
                <option value="">Yugioh</option>
            </select>
        </div>
        <div class="product-control-center">
            <form action="" class="form-search">
                <input type="text" id="form-search-product" placeholder="Tìm kiếm sản phẩm" oninput="showProduct()">
                <div class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
            </form>
        </div>
        <div class="product-control-right">
            <button class="btn-control" id="btn-add-product"><i class="fa-solid fa-plus"></i>Thêm sản phẩm</button>
            <button class="btn-control" id="btn-refresh-product"><i class="fa-solid fa-arrows-rotate"></i> Làm mới</button>
        </div>
    </div>
    <div class="show-product">
        <div class="list">
            <div class="list-left">
                <img src="../../img/keycap/AttackOnTitan/Eren.jpg" alt="">
                <div class="list-info">
                    <h4>Name-product</h4>
                    <p class="list-note"></p>
                    <span class="list-category">AttackOnTitan</span>
                </div>
            </div>
            <div class="list-right">
                <div class="list-price">
                    <span class="list-current-price">180.000&nbsp;₫</span>
                </div>
                <div class="list-control">
                    <div class="list-tool">
                        <button class="btn-edit"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn-view"><i class="fa-solid fa-eye"></i></button>
                        <button class="btn-delete"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="page-nav">
        <ul class="page-nav-list">
            <li class="page-nav-item active"><a href="#">1</a></li>
            <li class="page-nav-item"><a href="#">2</a></li>
            <li class="page-nav-item"><a href="#">3</a></li>
        </ul>
    </div>
</div>
