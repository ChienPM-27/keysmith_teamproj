<!-- Customer Section -->
<div class="section-header">
    <h1><i class="fa-solid fa-users"></i> Quản lý khách hàng</h1>
    <p>Quản lý và theo dõi khách hàng của cửa hàng.</p>
</div>

<div class="customer-body">
    <div class="customer-control">
        <div class="customer-control-left">
            <select name="user-status" id="filter-user-status">
                <option value="">Tất cả</option>
                <option value="active">Đang hoạt động</option>
                <option value="locked">Bị khóa</option>
            </select>
        </div>
        <div class="customer-control-center">
            <form action="" class="form-search" onsubmit="return false;">
                <input type="text" id="form-search-user" placeholder="Tìm kiếm khách hàng...">
                <div class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
            </form>
        </div>
        <div class="customer-control-right">
            <button class="btn-control" id="btn-add-user"><i class="fa-solid fa-plus"></i> Thêm khách hàng</button>
            <button class="btn-control" id="btn-refresh-user"><i class="fa-solid fa-arrows-rotate"></i> Làm mới</button>
        </div>
    </div>
    
    <!-- Container sẽ được JavaScript tự động fill vào -->
    <div class="show-customer-container" id="show-customer-container">
    </div>
</div>
