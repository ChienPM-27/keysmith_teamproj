<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KeySmith</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">
    <link rel="stylesheet" href="./assets/css/analytics.css">
    <link rel="stylesheet" href="./assets/css/warehouse.css">
    <link rel="stylesheet" href="./assets/css/dashboard.css">
    <link rel="stylesheet" href="./assets/css/products.css">
    <link rel="stylesheet" href="./assets/css/customers.css">
    <link rel="stylesheet" href="./assets/css/orders.css">
    <script src="https://kit.fontawesome.com/da0c4cdc9f.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Container -->
    <header class="header">
        <button class="menu-icon-btn">
            <div class="menu-icon"><i class="fa-solid fa-bars"></i></div>
        </button>
    </header>
    <div class="container">
        
        <!-- Sidebar Aside -->
        <aside class="sidebar open" id="sidebar">
            <div class="top-sidebar">
                <img src="../img/logo/logo_full.png" alt="logo_key_smith">
            </div>
            <div class="middle-sidebar">
                <ul class="sidebar-list">
                    <li class="sidebar-list-item tab-content active">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon"><i class="fa-solid fa-house"></i></div>
                            <div class="sidebar-hidden">Dashboard</div>
                        </a>
                    </li>
                    <li class="sidebar-list-item tab-content">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon"><i class="fa-solid fa-keyboard"></i></div>
                            <div class="sidebar-hidden">Products</div>
                        </a>
                    </li>
                    <li class="sidebar-list-item tab-content">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon"><i class="fa-solid fa-users"></i></div>
                            <div class="sidebar-hidden">Customers</div>
                        </a>
                    </li>
                    <li class="sidebar-list-item tab-content">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                            <div class="sidebar-hidden">Orders</div>
                        </a>
                    </li>
                    <li class="sidebar-list-item tab-content">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon"><i class="fa-solid fa-chart-simple"></i></div>
                            <div class="sidebar-hidden">Analytics</div>
                        </a>
                    </li>
                    <li class="sidebar-list-item tab-content">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon"><i class="fa-solid fa-warehouse"></i></div>
                            <div class="sidebar-hidden">Ware House</div>
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="bottom-sidebar">
                <ul class="sidebar-list">
                    <li class="sidebar-list-item user-logout">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon">
                                <i class="fa-solid fa-arrow-left"></i>
                            </div>
                            <div class="sidebar-hidden">Home page</div>
                        </a>
                    </li>
                    <li class="sidebar-list-item user-logout">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon">
                                <i class="fa-solid fa-user-shield"></i>
                            </div>
                            <div class="sidebar-hidden">Admin</div>
                        </a>
                    </li>
                    <li class="sidebar-list-item user-logout">
                        <a href="#" class="sidebar-link">
                            <div class="sidebar-icon">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            </div>
                            <div class="sidebar-hidden">Log out</div>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>
        
        <main class="content">
            <div id="dashboard-section" class="section active dashboard-wrapper"></div>
            <div id="products-section" class="section products-wrapper"></div>
            <div id="customer-section" class="section customer-wrapper"></div>
            <div id="orders-section" class="section orders-wrapper"></div>

            <!-- Analytics Section với wrapper -->
            <div id="analytics-section" class="section analytics-wrapper"></div>
            
            <!-- Warehouse Section với wrapper -->
            <div id="warehouse-section" class="section warehouse-wrapper"></div>
        </main>

    </div>

    <script src="./js/DataManager.js"></script>
    <script src="./js/include.js"></script>
    <script src="./js/analytics.js"></script>
    <script src="./js/warehouse-data.js"></script>
    <script src="./js/warehouse.js"></script>
    <script src="./script.js"></script>
    <script src="./js/dashboard.js"></script>
    <script src="./js/products.js"></script>

</body>
</html>
