<div class="section-header">
    <h1>
        <i class="fa-solid fa-house"></i>
        Dashboard
    </h1>
    <p>Trang tổng quát của KeySmith</p>
</div>

<div class="dashboard-body">
    <div class="cards">
        <div class="card-single">
            <div class="box">
                <div class="box-container">
                    <div class="box-title">
                        <div class="title-name">Customers</div>
                        <div class="title-logo"><i class="fa-solid fa-users"></i></div>
                    </div>
                    <div class="box-content">
                        <div class="amount-user" id="userCount">6</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-single">
            <div class="box">
                <div class="box-container">
                    <div class="box-title">
                        <div class="title-name">Products</div>
                        <div class="title-logo"><i class="fa-solid fa-cart-shopping"></i></div>
                    </div>
                    <div class="box-content">
                        <div class="amount-product" id="productCount">10</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-single">
            <div class="box">
                <div class="box-container">                    
                    <div class="box-title">
                        <div class="title-name">Revenue</div>
                        <div class="title-logo"><i class="fa-solid fa-money-bill"></i></div>
                    </div>
                    <div class="box-content">
                        <div class="amount" id="revenueTotal">100000</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-single">
            <div class="box">
                <div class="box-container">
                    <div class="box-title">
                        <div class="title-name">Inventory</div>
                        <div class="title-logo"><i class="fa-solid fa-warehouse"></i></div>
                    </div>
                    <div class="box-content">
                        <div class="amount" id="stockTotal">10</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="alerts">
    <div class="alert-box">
        <div class="alert-icon">
            <i class="fa-solid fa-exclamation-triangle"></i>
        </div>
        <span>3 sản phẩm sắp hết hàng!</span>
    </div>
    </div>
    <!-- Hidden placeholder for orders count (script expects this id). Kept hidden to avoid layout changes -->
    <div id="ordersCount" style="display:none">0</div>
    <div>
    <canvas id="myChart"></canvas>
    </div>

</div>
